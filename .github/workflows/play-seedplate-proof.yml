name: PLAY-SEEDPLATE proof
on:
  pull_request:
    paths:
      - 'experiments/play-seedplate-001/**'
      - '.github/workflows/play-seedplate-proof.yml'
  push:
    branches: [experiment/play-seedplate-001]
    paths:
      - 'experiments/play-seedplate-001/**'
      - '.github/workflows/play-seedplate-proof.yml'

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser modules
        run: |
          node --check experiments/play-seedplate-001/seedplate.mjs
          node --check experiments/play-seedplate-001/app.mjs
          node --check experiments/play-seedplate-001/room-projection.mjs
          node --check experiments/play-seedplate-001/listening-room.mjs
      - name: Run pure gameplay checks
        run: node --test experiments/play-seedplate-001/seedplate.test.mjs experiments/play-seedplate-001/listening-room.test.mjs
      - name: Install pinned browser QA dependency
        run: |
          cd experiments/play-seedplate-001
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Play the phone-sized spatial room and its fallback
        run: |
          cd experiments/play-seedplate-001
          node browser-smoke.mjs
      - name: Save browser QA screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: listening-room-phone-qa
          path: experiments/play-seedplate-001/listening-room-phone*.png
          if-no-files-found: ignore
